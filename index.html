<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; }
        #bg-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; object-fit: cover; opacity: 0.6; pointer-events: none; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: -1; }
        .click-shield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10; display: flex; justify-content: center; align-items: center; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; transition: opacity 0.5s ease; user-select: none; }
        .card { background: rgba(15,15,15,0.75); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; width: 350px; padding: 24px; text-align: center; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative; }
        .audio-ctrl { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: #fff; font-size: 14px; transition: all 0.2s; user-select: none; }
        .audio-ctrl:hover { background: rgba(255,255,255,0.15); }
        .avatar-container { position: relative; width: 96px; height: 96px; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #222; border: 2px solid rgba(255,255,255,0.1); }
        .status-dot { position: absolute; bottom: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; border: 4px solid #111; background: #747f8d; transition: background 0.3s ease; }
        .status-dot.online { background: #3ba55d; }
        .status-dot.idle { background: #faa81a; }
        .status-dot.dnd { background: #ed4245; }
        .status-dot.offline { background: #747f8d; }
        .header-section { display: flex; flex-direction: column; gap: 4px; width: 100%; }
        .username { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .handle { font-size: 14px; color: #b5b5b5; }
        .custom-status { font-size: 13px; color: #e0e0e0; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.03); white-space: normal; overflow-wrap: break-word; word-break: break-word; display: none; }
        .spotify-card { display: none; width: 100%; background: rgba(30,215,96,0.1); border: 1px solid rgba(30,215,96,0.2); border-radius: 10px; padding: 10px; text-align: left; align-items: center; gap: 12px; }
        .spotify-album { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }
        .spotify-info { flex: 1; min-width: 0; }
        .spotify-track { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .spotify-artist { font-size: 11px; color: #1ed760; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .links-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .link-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); padding: 10px; border-radius: 8px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 500; transition: all 0.2s ease; }
        .link-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.2); transform: translateY(-1px); }
        .stars-decor { width: 18px; height: 18px; object-fit: contain; }
    </style>
</head>
<body>

    <!-- Fixed background attributes to pass cross-origin layout rendering rules -->
    <video id="bg-video" loop muted playsinline preload="auto" width="100%" height="100%">
        <source src="bg-video.mp4" type="video/mp4">
    </video>
    <audio id="bg-audio" loop preload="auto">
        <source src="bg-music.mp3" type="audio/mpeg">
    </audio>
    <div class="overlay"></div>

    <div class="click-shield" id="shield" onclick="startSite()">[ Click to Enter ]</div>

    <div class="card">
        <div id="mute-btn" class="audio-ctrl" onclick="toggleAudio()">🔊</div>
        
        <div class="avatar-container">
            <img id="avatar" class="avatar" src="stars.gif" alt="Profile pic">
            <div id="status" class="status-dot offline"></div>
        </div>

        <div class="header-section">
            <div class="username">wh3ff</div>
            <div class="handle">@wh3f</div>
        </div>

        <div id="custom-status" class="custom-status"></div>

        <div id="spotify" class="spotify-card">
            <img id="spotify-art" class="spotify-album" src="" alt="Album Art">
            <div class="spotify-info">
                <div id="spotify-track" class="spotify-track"></div>
                <div id="spotify-artist" class="spotify-artist"></div>
            </div>
        </div>

        <div class="links-grid">
            <a href="https://discord.com" target="_blank" class="link-btn">
                <img src="stars.gif" class="stars-decor" alt="icon"> View Profile
            </a>
            <a href="https://steamcommunity.com" target="_blank" class="link-btn">
                <img src="stars.gif" class="stars-decor" alt="icon"> steam
            </a>
            <a href="https://steamcommunity.com" target="_blank" class="link-btn">
                <img src="stars.gif" class="stars-decor" alt="icon"> trade link
            </a>
            <a href="https://soundcloud.com" target="_blank" class="link-btn">
                <img src="stars.gif" class="stars-decor" alt="icon"> tuff ass beats
            </a>
        </div>
    </div>

    <script>
        const userId = "530081539220963355";
        let socket;
        let heartbeatInterval;

        initWebSocket();

        function startSite() {
            const shield = document.getElementById('shield');
            const video = document.getElementById('bg-video');
            const audio = document.getElementById('bg-audio');
            
            shield.style.opacity = '0';
            setTimeout(() => shield.remove(), 500);
            
            // Fixed direct playback handler methods
            video.load();
            audio.load();
            
            let playVideo = video.play();
            if (playVideo !== undefined) {
                playVideo.catch(err => console.log("Video fail:", err));
            }
            
            let playAudio = audio.play();
            if (playAudio !== undefined) {
                playAudio.catch(err => console.log("Audio fail:", err));
            }
        }

        function toggleAudio() {
            const audio = document.getElementById('bg-audio');
            const btn = document.getElementById('mute-btn');
            if (audio.paused) {
                audio.play();
                btn.textContent = '🔊';
            } else {
                audio.pause();
                btn.textContent = '🔇';
            }
        }

        function initWebSocket() {
            socket = new WebSocket("wss://api.lanyard.rest/socket");

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (msg.op === 1) { 
                    heartbeatInterval = setInterval(() => {
                        socket.send(JSON.stringify({ op: 3 })); 
                    }, msg.d.heartbeat_interval);

                    socket.send(JSON.stringify({
                        op: 2,
                        d: { subscribe_to_id: userId }
                    }));
                }

                if (msg.op === 0 && (msg.t === "INIT_STATE" || msg.t === "PRESENCE_UPDATE")) {
                    updatePresence(msg.d);
                }
            };

            socket.onclose = () => {
                clearInterval(heartbeatInterval);
                setTimeout(initWebSocket, 5000);
            };
        }

        function updatePresence(d) {
            if (!d) return;

            document.getElementById('status').className = 'status-dot ' + (d.discord_status || 'offline');

            const avatarImg = document.getElementById('avatar');
            const faviconLink = document.getElementById('favicon');
            
            if (d.discord_user && d.discord_user.avatar) {
                const ext = d.discord_user.avatar.startsWith('a_') ? 'gif' : 'png';
                const dynamicUrl = `https://discordapp.com{userId}/${d.discord_user.avatar}.${ext}?size=256`;
                avatarImg.src = dynamicUrl;
            }

            const cStatusBox = document.getElementById('custom-status');
            const customAct = d.activities ? d.activities.find(a => a.type === 4) : null;
            
            if (customAct && (customAct.state || customAct.emoji)) {
                let statusText = '';
                if (customAct.emoji && customAct.emoji.name) statusText += customAct.emoji.name + ' ';
                if (customAct.state) statusText += customAct.state;
                
                cStatusBox.textContent = statusText.trim();
                cStatusBox.style.display = 'block';
            } else {
                cStatusBox.style.display = 'none';
            }
const spotifyBox = document.getElementById('spotify');
if (d.listening_to_spotify && d.spotify) {
    document.getElementById('spotify-art').src = d.spotify.album_art_url || '';
    document.getElementById('spotify-track').textContent = d.spotify.track || 'Unknown Track';
    document.getElementById('spotify-artist').textContent = d.spotify.artist || 'Unknown Artist';
    spotifyBox.style.display = 'flex';
} else {
    spotifyBox.style.display = 'none';
        }
    </script>
</body>
</html>
